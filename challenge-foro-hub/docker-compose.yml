services:
  db:
    image: mysql:8.0
    container_name: forumhub_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: forumhub_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - forumhub-network

volumes:
  mysql-data:

networks:
  forumhub-network:
    driver: bridge
