<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro Hub - Formulario Tópico</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light pb-5">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html"><i class="bi bi-chat-square-text me-2"></i>Foro
                Hub</a>
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#" id="btnLogout"><i
                                class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-bottom py-3">
                        <h4 class="mb-0 text-secondary" id="formTitle"><i class="bi bi-pencil-square me-2"></i> Nuevo
                            Tópico</h4>
                    </div>
                    <div class="card-body p-4">
                        <div id="formAlert" class="alert d-none" role="alert"></div>

                        <form id="topicoForm">
                            <input type="hidden" id="topicoId">

                            <div class="mb-3">
                                <label for="tituloInput" class="form-label fw-bold">Título del Tópico *</label>
                                <input type="text" class="form-control" id="tituloInput" required
                                    placeholder="Ej: Error de compilación en Java">
                            </div>

                            <div class="mb-3">
                                <label for="mensajeInput" class="form-label fw-bold">Mensaje / Detalle *</label>
                                <textarea class="form-control" id="mensajeInput" rows="5" required
                                    placeholder="Describe tu duda o comentario..."></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="autorInput" class="form-label fw-bold">Nombre del Autor *</label>
                                    <input type="text" class="form-control" id="autorInput" required
                                        placeholder="Tu nombre">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="cursoInput" class="form-label fw-bold">Nombre del Curso *</label>
                                    <input type="text" class="form-control" id="cursoInput" required
                                        placeholder="Ej: Spring Boot 3">
                                </div>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a href="dashboard.html" class="btn btn-outline-secondary"><i
                                        class="bi bi-arrow-left me-1"></i> Cancelar</a>
                                <button type="submit" class="btn btn-primary" id="btnSubmit"><i
                                        class="bi bi-save me-1"></i> Guardar Tópico</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            verificarAutenticacion();
            // Verificar si es edición (leer ID de URL)
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                cargarDatosTopico(id);
            }
        });
    </script>
</body>

</html>
