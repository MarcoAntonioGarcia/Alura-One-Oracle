<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro Hub - Iniciar Sesión</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light d-flex align-items-center py-4 content-body">

    <main class="form-signin w-100 m-auto text-center">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <h1 class="h3 mb-3 fw-normal text-primary">Foro Hub</h1>
                <p class="text-muted mb-4">Ingresa tus credenciales para continuar</p>

                <div id="loginAlert" class="alert alert-danger d-none" role="alert">
                    Usuario o contraseña incorrectos.
                </div>

                <form id="loginForm">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="loginInput" placeholder="usuario" required>
                        <label for="loginInput">Usuario</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="passwordInput" placeholder="Contraseña"
                            required>
                        <label for="passwordInput">Contraseña</label>
                    </div>

                    <button class="btn btn-primary w-100 py-2" type="submit">Iniciar Sesión</button>
                    <p class="mt-5 mb-3 text-body-secondary">&copy; 2024 - Alura Latam</p>
                </form>
            </div>
        </div>
    </main>

    <script src="js/app.js?v=2"></script>
</body>

</html>
